<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva Ilha Figueira</title>

    <!-- Configurações PWA (App Nativo) -->
    <link rel="icon" href="https://fav.farm/🏝️" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#047857">

    <!-- Fontes Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --brand-green: #047857;
            --brand-green-dark: #065f46;
            --brand-green-light: #ecfdf5;
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --occupied: #fee2e2;
            --occupied-text: #991b1b;
            --selected: #047857;
            --selected-text: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding-bottom: 110px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            background: var(--bg-main);
        }

        /* Header Moderno */
        header {
            background: linear-gradient(135deg, var(--brand-green), var(--brand-green-dark));
            color: white;
            padding: 24px 20px;
            border-bottom-left-radius: 24px;
            border-bottom-right-radius: 24px;
            box-shadow: 0 10px 25px -5px rgba(4, 120, 87, 0.25);
            text-align: center;
        }

        header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        header p {
            font-size: 0.85rem;
            opacity: 0.9;
            margin-top: 4px;
        }

        .btn-share {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-top: 14px;
            cursor: pointer;
            font-weight: 600;
            backdrop-filter: blur(4px);
            transition: all 0.2s ease;
        }

        .btn-share:active {
            transform: scale(0.96);
            background: rgba(255, 255, 255, 0.3);
        }

        /* Seção do Calendário */
        .calendar-card {
            background: var(--card-bg);
            margin: 16px;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            border: 1px solid var(--border-color);
        }

        .controles-mes {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .mes-navegacao {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .mes-navegacao h2 {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
            text-transform: capitalize;
        }

        .btn-mes {
            background: #f1f5f9;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            cursor: pointer;
            color: var(--text-main);
            transition: background 0.2s;
        }

        .btn-mes:active {
            background: #e2e8f0;
        }

        .btn-hoje {
            background: var(--brand-green-light);
            color: var(--brand-green-dark);
            border: none;
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-hoje:active {
            transform: scale(0.95);
        }

        /* Grade do Calendário */
        .dias-semana {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: 600;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .grade-dias {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }

        .dia {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            position: relative;
            cursor: pointer;
            user-select: none;
            transition: all 0.15s ease;
        }

        .dia.vazio {
            cursor: default;
        }

        .dia.inativo {
            color: #cbd5e1;
            background: #f8fafc;
            cursor: not-allowed;
            opacity: 0.45;
        }

        .dia.livre {
            background: #f1f5f9;
            color: var(--text-main);
        }

        .dia.livre:active {
            transform: scale(0.92);
        }

        .dia.ocupado {
            background: var(--occupied);
            color: var(--occupied-text);
            cursor: pointer;
        }

        .dia.selecionado {
            background: var(--selected) !important;
            color: var(--selected-text) !important;
            box-shadow: 0 4px 10px rgba(4, 120, 87, 0.3);
        }

        .aniversario-icone {
            font-size: 0.65rem;
            position: absolute;
            top: 2px;
            right: 2px;
        }

        /* Legenda */
        .legenda {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px dashed var(--border-color);
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .legenda-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .dot.livre { background: #f1f5f9; border: 1px solid #cbd5e1; }
        .dot.ocupado { background: var(--occupied); }
        .dot.selecionado { background: var(--selected); }

        /* Aniversariantes do Mês */
        .aniversarios-card {
            background: var(--card-bg);
            margin: 0 16px 16px 16px;
            border-radius: 20px;
            padding: 18px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
        }

        .aniversarios-card h3 {
            font-size: 0.95rem;
            color: var(--text-main);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .lista-aniversarios {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .aniversario-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fafafa;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 0.85rem;
            border: 1px solid #f1f5f9;
        }

        .aniversario-item .nome {
            font-weight: 600;
            color: var(--text-main);
        }

        .aniversario-item .data {
            font-weight: 700;
            color: var(--brand-green);
            background: var(--brand-green-light);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
        }

        .sem-aniversarios {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-style: italic;
        }

        /* Barra Flutuante de Confirmação */
        .barra-flutuante {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%) translateY(100%);
            width: 100%;
            max-width: 480px;
            background: white;
            padding: 16px 20px;
            box-shadow: 0 -10px 25px rgba(0,0,0,0.1);
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 100;
        }

        .barra-flutuante.ativa {
            transform: translateX(-50%) translateY(0);
        }

        .info-selecao .qtd {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .info-selecao .detalhe {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .btn-reservar {
            background: #25d366;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
            transition: all 0.2s;
        }

        .btn-reservar:active {
            transform: scale(0.96);
        }

        /* Loading */
        .loading-overlay {
            text-align: center;
            padding: 30px;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Associação Ilha Figueira</h1>
            <p>Agenda Oficial de Reservas • Rio Ivaí</p>
            <button class="btn-share" onclick="compartilharApp()">
                📲 Compartilhar Agenda

        <div class="calendar-card">

    </div>

        <button class="btn-reservar" onclick="enviarWhatsApp()">

        </button>
    </div>
